name: Sync Google Sheets Locations

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-all-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync BattleLocations from Google Sheets
        run: |
          echo "Syncing BattleLocations (GID 0)..."
          npm run sync-sheets-locations
          echo "BattleLocations sync complete."

      - name: Sync EncounterLocations from Google Sheets
        run: |
          echo "Syncing EncounterLocations (GID 170288071)..."
          npm run sync-encounter-locations
          echo "EncounterLocations sync complete."

      - name: Validate locations data
        run: node scripts/validate-locations.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/locations.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update locations from Google Sheets (BattleLocations + EncounterLocations)"
            git push
            echo "Changes committed and pushed."
          fi
