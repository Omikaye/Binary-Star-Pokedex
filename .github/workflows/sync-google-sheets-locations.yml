name: Sync Google Sheets Locations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-locations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync locations from Google Sheets
        run: npm run sync-sheets-locations

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/locations.json
          git diff --staged --quiet || git commit -m "Update locations.json from Google Sheets"
          git push
