name: Sync Item Locations from Google Sheets

on:
  workflow_dispatch:
    inputs:
      item_locations_gid:
        description: 'GID of the ItemLocations sheet tab'
        required: true
        default: ''
        type: string

permissions:
  contents: write

jobs:
  sync-item-locations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync item locations from Google Sheets
        run: npm run sync-item-locations -- ${{ inputs.item_locations_gid }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/locations.json
          git diff --staged --quiet || git commit -m "Update item locations from Google Sheets (ItemLocations tab)"
          git push
