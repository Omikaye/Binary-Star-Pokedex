name: Sync Item Locations from Google Sheets (Optional - Use Unified Workflow Instead)

# NOTE: This workflow is kept for backward compatibility and special cases.
# For normal use, run the "Sync Google Sheets Locations" workflow instead,
# which syncs locations, shops, AND items all at once with hardcoded GIDs.
#
# Use this workflow ONLY if you need to:
# - Sync items from a different sheet (custom GID)
# - Sync ONLY items without touching other data

on:
  workflow_dispatch:
    inputs:
      item_locations_gid:
        description: 'GID of the ItemLocations sheet tab'
        required: true
        default: '1958269454'
        type: string

permissions:
  contents: write

jobs:
  sync-item-locations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync item locations from Google Sheets
        run: npm run sync-item-locations -- ${{ inputs.item_locations_gid }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/locations.json
          git diff --staged --quiet || git commit -m "Update item locations from Google Sheets (ItemLocations tab)"
          git push
