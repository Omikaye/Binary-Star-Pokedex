name: Refresh Json Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-json-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh data JSON from rawtxt
        run: |
          npm run import-all
          npm run import-moves
          npm run parse-locations
          npm run parse-static
          npm run import-trainers
          npm run import-basegame
          npm run convert-evolutions
          npm run convert-mega-evolutions
          node scripts/parse-items.js
          node scripts/update-item-icons.js
          node scripts/generate-pokemon-icons.js
          npm run generate-links

      - name: Commit and push refreshed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json 'data/**/*.json'
          if git diff --staged --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Refresh data JSON from rawtxt [skip ci]"
            git push
          fi
